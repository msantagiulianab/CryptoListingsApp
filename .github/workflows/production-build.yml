# Manually-triggered "production" pipeline.
#
# Signs the release APK with a keystore injected from GitHub Secrets:
#   - KEYSTORE_BASE64            base64-encoded release.keystore file
#   - RELEASE_KEYSTORE_PASSWORD  keystore password
#   - RELEASE_KEY_ALIAS          key alias
#   - RELEASE_KEY_PASSWORD       key password
# The native Gradle build (app/build.gradle.kts) reads these credentials from
# the environment and wires them into the release signing config.
name: Build Production APK (Signed)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/app/release.keystore

      - name: Compile signed release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: 🔐 Sign Production APK via apksigner
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p dist
          
          echo "=== Locating Android SDK apksigner tool ==="
          APKSIGNER_PATH=$(find ${ANDROID_HOME}/build-tools/ -name "apksigner" | sort -V | tail -n 1)
          if [ -z "$APKSIGNER_PATH" ]; then
            echo "::error::apksigner tool could not be found in Android build-tools!"
            exit 1
          fi
          echo "Using apksigner at: $APKSIGNER_PATH"
          
          echo "=== Signing Unsigned Production APK ==="
          $APKSIGNER_PATH sign \
            --ks app/release.keystore \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out dist/cryptolistings-production-final.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
            
          echo "=== Verifying Signed Production Signature ==="
          $APKSIGNER_PATH verify --verbose dist/cryptolistings-production-final.apk

      - name: Upload signed release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cryptolistings-production-final-apk
          path: dist/cryptolistings-production-final.apk
          if-no-files-found: error

      - name: Delete existing production-release tag (if any)
        continue-on-error: true
        run: git push origin --delete production-release || true

      - name: Create or update Production Release
        uses: softprops/action-gh-release@v2
        with:
          name: Production Build
          tag_name: production-release
          target_commitish: ${{ github.sha }}
          body: |
            Manually triggered via `workflow_dispatch`.

            Signed release APK built with `./gradlew assembleRelease` and
            signed with the keystore provided by GitHub Secrets.

            **Commit:** `${{ github.sha }}`
            **Branch:** `${{ github.ref_name }}`
          files: dist/cryptolistings-production-final.apk
          make_latest: true
