# Builds an unsigned debug APK whenever a version tag (v*) is pushed.
#
# The scripts/release.sh helper creates and pushes the tag locally; this
# workflow runs on GitHub Actions, compiles the APK via the Gradle wrapper,
# and attaches it to a GitHub Release for the same tag.
name: Build Android Debug APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build unsigned debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile unsigned debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cryptolistings-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create GitHub Release and attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Automated **unsigned debug** build for tag `${{ github.ref_name }}`.

            - Compiled with `./gradlew assembleDebug` on GitHub Actions
            - APK is **not signed for release** — development/testing only
            - No keystore / signing credentials are configured at this time

            **Commit:** `${{ github.sha }}`
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: false
          prerelease: ${{ contains(github.ref_name, '-') }}
